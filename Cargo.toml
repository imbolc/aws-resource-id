[package]
description = "Copyable AWS resource IDs"
edition = "2021"
license = "MIT"
name = "aws-resource-id"
repository = "https://github.com/imbolc/aws-resource-id"
version = "2.0.0"

[features]
sqlx-postgres = ["sqlx"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
sqlx = { version = "0.9", features = ["postgres"], optional = true }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
] }
